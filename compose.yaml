# compose.yaml
# Levanta los servicios de Zonalia (issue #6). Cada nodo usa su perfil:
#   n1: api y nginx · n2: base primaria · n3: base réplica · n4: mongo · local: todo en una laptop
# Las contraseñas y usuarios vienen del archivo .env (copia de .env.example), nunca de este archivo.

name: zonalia

services:
  db:
    image: postgres:16
    profiles: ["n2", "local"]
    # El pg_hba.conf de Zonalia (#19) reemplaza al que trae la imagen.
    command: ["postgres", "-c", "hba_file=/etc/zonalia/pg_hba.conf"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_REPLICACION_USER: ${POSTGRES_REPLICACION_USER}
      POSTGRES_REPLICACION_PASSWORD: ${POSTGRES_REPLICACION_PASSWORD}
    volumes:
      - db-datos:/var/lib/postgresql/data
      - ./db/esquema:/docker-entrypoint-initdb.d:ro
      - ./db/replicacion:/etc/zonalia:ro
    ports:
      # 127.0.0.1 en local; en N2, la IP de la VPN (10.10.0.2) para que N3 llegue.
      - "${IP_PUBLICACION_DB:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Réplica de n2 por la VPN (#19). Su volumen se llena una sola vez con
  # pg_basebackup (ver db/replicacion/README.md); después arranca como réplica.
  db-replica:
    image: postgres:16
    profiles: ["n3"]
    command: ["postgres", "-c", "hba_file=/etc/zonalia/pg_hba.conf"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_REPLICACION_USER: ${POSTGRES_REPLICACION_USER}
      PGPASSWORD: ${POSTGRES_REPLICACION_PASSWORD}
      PRIMARIO_HOST: ${PRIMARIO_HOST}
    volumes:
      - db-replica-datos:/var/lib/postgresql/data
      - ./db/replicacion:/etc/zonalia:ro
    ports:
      - "${IP_PUBLICACION_DB:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    profiles: ["n4", "local"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-datos:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./servicios
    profiles: ["n1", "local"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_API_USER: ${POSTGRES_API_USER}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD}
      POSTGRES_HOSTS: ${POSTGRES_HOSTS}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      JWT_SECRETO: ${JWT_SECRETO}
      JWT_MINUTOS_EXPIRACION: ${JWT_MINUTOS_EXPIRACION}
      CORS_ORIGENES: ${CORS_ORIGENES}
    depends_on:
      db:
        condition: service_healthy
        required: false
      mongo:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    profiles: ["n1", "local"]
    volumes:
      - ./infra/nginx/zonalia.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # IDS pasivo en N1 (#24): mira el tráfico que llega a Nginx y anota alertas, no bloquea.
  suricata:
    image: jasonish/suricata:7.0
    profiles: ["n1"]
    network_mode: "service:nginx"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    command:
      - "-i"
      - "eth0"
      - "--set"
      - "vars.address-groups.EXTERNAL_NET=any"
      - "-s"
      - "/opt/suricata/zonalia.rules"
    volumes:
      - ./infra/ids/zonalia.rules:/opt/suricata/zonalia.rules:ro
      - suricata-reglas:/var/lib/suricata
      - suricata-logs:/var/log/suricata
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  db-datos:
  db-replica-datos:
  mongo-datos:
  suricata-reglas:
  suricata-logs:
