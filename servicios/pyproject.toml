[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zonalia"
version = "0.1.0"
description = "Servicios en Python de Zonalia: API, dominio, datos, análisis y generador"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx", "ruff", "bandit", "pip-audit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
