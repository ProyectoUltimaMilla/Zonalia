# pg_hba.conf de Zonalia (issue #19). Lo usan db (N2) y db-replica (N3) por igual,
# así N3 acepta las mismas conexiones si un día se vuelve primario (#25).
# Se lee en orden: gana la primera línea que coincide.

# Dentro del contenedor (docker compose exec, scripts de inicio): sin contraseña.
# Solo se puede usar desde dentro del contenedor.
local   all            all                       trust

# Todo lo que llega por red pide contraseña con scram-sha-256.
# Docker Desktop no deja ver la IP real de quien se conecta (todas llegan desde su
# puerta de enlace), por eso aquí no se puede filtrar por la IP de la VPN. El filtro está
# en el puerto: compose lo publica solo en la IP de la VPN del nodo (IP_PUBLICACION_DB),
# y el firewall del #34 cierra el resto.
host    replication    all       all             scram-sha-256
host    all            all       all             scram-sha-256